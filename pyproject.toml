[project]
name = "dictator"
version = "0.1.0"
description = "Local push-to-talk dictation: hold a key, speak, and the text lands wherever your cursor is. 100% on-device (faster-whisper), no cloud, no rate limits."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "faster-whisper>=1.0.3",
    "sounddevice>=0.4.6",
    "soundfile>=0.12.1",
    "numpy>=1.26",
    "pynput>=1.7.7",
    "pyperclip>=1.8.2",
    "pyyaml>=6.0",
    "click>=8.1",
    "rumps>=0.4.0 ; sys_platform == 'darwin'",
    "pyobjc-framework-WebKit>=10.0 ; sys_platform == 'darwin'",
    # Capture backend that avoids PortAudio's stop-path deadlock (see audio.py).
    "pyobjc-framework-AVFoundation>=10.0 ; sys_platform == 'darwin'",
    # Rate-converts the hardware capture rate down to Whisper's 16 kHz. Was
    # only present transitively via realtimestt, which is now dormant.
    "scipy>=1.11",
    "realtimestt>=1.0.2",
    "silero-vad>=6.2.1",
]

[project.scripts]
dictator = "dictator.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dictator"]
